server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # consent-command-service (POST grant/deactivate/revoke)
    location /consent-cmd/ {
        rewrite ^/consent-cmd/(.*)$ /$1 break;
        proxy_pass http://consent-command-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # consent-query-service (GET authorizations/history + batch)
    location /consent-qry/ {
        rewrite ^/consent-qry/(.*)$ /$1 break;
        proxy_pass http://consent-query-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # dashboard-query-service (service base path is /dashboard/metrics)
    location /dashboard/ {
        proxy_pass http://dashboard-query-service:8080/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # user-service
    location /users/ {
        rewrite ^/users/(.*)$ /$1 break;
        proxy_pass http://user-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # billing-service
    location /billing/ {
        rewrite ^/billing/(.*)$ /$1 break;
        proxy_pass http://billing-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # promotion-service
    location /promotions/ {
        rewrite ^/promotions/(.*)$ /$1 break;
        proxy_pass http://promotion-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # audit-service
    location /audit/ {
        rewrite ^/audit/(.*)$ /$1 break;
        proxy_pass http://audit-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # keycloak token endpoint (auto-login via password grant)
    location /kc-token/ {
        rewrite ^/kc-token/(.*)$ /$1 break;
        proxy_pass http://consent-keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
